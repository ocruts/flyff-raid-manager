<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flyff Raid Manager</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#f2efff;background:#111323}*{box-sizing:border-box}body{margin:0}header{padding:26px max(20px,calc((100vw - 1050px)/2));background:#1b1d34;border-bottom:1px solid #353655}h1{margin:0;font-size:28px}header p{color:#b9b6d3;margin:8px 0 0}main{max-width:1050px;margin:30px auto;padding:0 18px}.panel,.raid{background:#20223a;border:1px solid #393b5b;border-radius:16px;padding:22px;margin-bottom:20px}h2{margin-top:0;font-size:21px}label{display:block;margin:12px 0 5px;color:#d6d1ee}input,select,button{font:inherit;border-radius:9px;padding:11px}input,select{width:100%;background:#15172b;border:1px solid #525374;color:white}button{border:0;background:#8669e8;color:white;cursor:pointer;font-weight:700}button:hover{background:#9c84ed}button.secondary{background:#3a3d61}button.danger{background:#793e59}button:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:#bbb8d1}.pill{background:#3b3464;border-radius:999px;padding:6px 12px}.members{padding-left:20px}.members li{margin:8px 0}.members button{padding:4px 8px;margin-left:10px}.empty{color:#c2bfd7}#message{min-height:24px;color:#bdb0ff}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>⚔️ Flyff Raid Manager</h1><p>Organise les instances de ta guilde Flyff Universe</p></header>
<main>
<section class="panel"><h2>Créer une instance</h2>
<form id="createForm"><div class="grid"><div><label for="raidName">Nom de l'instance</label><input id="raidName" required maxlength="70" placeholder="Ankou 20h10"></div><div><label for="raidDate">Date</label><input id="raidDate" type="date" required></div><div><label for="raidTime">Heure</label><input id="raidTime" type="time" required value="21:10"></div><div><label for="raidSlots">Nombre de places (1 à 40)</label><input id="raidSlots" type="number" min="1" max="40" required value="8"></div></div><label><input id="discordPing" type="checkbox" style="width:auto" checked> Notification Discord souhaitée (non active en V1)</label><p><button type="submit">+ Créer l'instance</button></p></form><p id="message" role="status"></p></section>
<section><div class="top"><h2>Instances programmées</h2><span id="count" class="muted"></span></div><div id="raids"></div></section>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
// Remplace uniquement ces deux valeurs par les informations PUBLIQUES de ton projet.
const SUPABASE_URL = 'https://ejsxjvjeumgjsvprwwdd.supabase.co/rest/v1/;
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_a-PHo9vsvkJPuL1Dya22CA_XBHBKRqv';
const $ = id => document.getElementById(id);
const status = $('message');
const root = $('raids');
const createForm = $('createForm');
const submit = createForm.querySelector('button[type="submit"]');
submit.disabled = true;
const info = document.createElement('p');
info.className = 'muted';
info.textContent = 'Création et inscriptions désactivées temporairement : nous activerons les écritures sécurisées à la prochaine étape.';
createForm.append(info);
const refresh = document.createElement('button');
refresh.type = 'button';
refresh.className = 'secondary';
refresh.textContent = '↻ Actualiser les instances';
root.before(refresh);
function el(tag, text, cls) { const node=document.createElement(tag); if(text!==undefined) node.textContent=text; if(cls) node.className=cls; return node; }
const configured = SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('TON-PROJET') && SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_') && SUPABASE_PUBLISHABLE_KEY !== 'sb_publishable_TA_CLE';
if (!configured) {
  status.textContent = 'Configuration requise : renseigne SUPABASE_URL et SUPABASE_PUBLISHABLE_KEY dans index.html.';
  refresh.disabled = true;
} else {
  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  async function loadRaids() {
    status.textContent = 'Chargement des instances depuis Supabase…';
    root.replaceChildren();
    const {data, error} = await supabase.from('raids').select('id,name,starts_at,max_players,discord_notification').order('starts_at', {ascending:true});
    if (error) { status.textContent = 'Erreur Supabase : ' + error.message; $('count').textContent = ''; return; }
    status.textContent = 'Connexion Supabase réussie !';
    $('count').textContent = data.length + ' instance(s)';
    if (!data.length) root.append(el('p','Aucune instance dans Supabase.','empty'));
    for (const raid of data) {
      const card=el('article',undefined,'raid');
      const top=el('div',undefined,'top');
      top.append(el('h2',raid.name),el('span',raid.max_players+' places maximum','pill'));
      card.append(top);
      const date = new Date(raid.starts_at);
      const when = new Intl.DateTimeFormat('fr-FR',{dateStyle:'full',timeStyle:'short',timeZone:'Europe/Paris'}).format(date);
      card.append(el('p','📅 '+when+' · Discord : '+(raid.discord_notification?'notification prévue':'désactivé'),'muted'));
      card.append(el('p','Inscriptions bientôt disponibles avec la connexion Discord.','muted'));
      root.append(card);
    }
  }
  refresh.addEventListener('click',loadRaids);
  loadRaids();
}
</script>
</body></html>
